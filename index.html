<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusStream</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #111328;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      background: #1a1c38;
      border: 1px solid #2a2d54;
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-weight: 800;
      font-size: 18px;
      color: #a855f7;
      line-height: 1.2;
    }
    .logo span {
      display: block;
      color: #c084fc;
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .theme-select {
      background: #121429;
      color: #ffffff;
      border: 1px solid #2a2d54;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
    }
    .btn-purple {
      background: #8b5cf6;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .video-card {
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      width: 100%;
      max-height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #2a2d54;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .controls-panel {
      background: #1a1c38;
      border: 1px solid #2a2d54;
      border-radius: 20px;
      padding: 14px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }
    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #25284c;
      border: 1px solid #3b3f73;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }
    .chat-card {
      background: #1a1c38;
      border: 1px solid #2a2d54;
      border-radius: 16px;
      padding: 16px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-title {
      font-weight: 600;
      font-size: 15px;
    }
    .lang-select {
      background: #121429;
      color: #ffffff;
      border: 1px solid #2a2d54;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">Nexus<br><span>Stream</span></div>
    <div class="header-actions">
      <select class="theme-select">
        <option>Midnight Nebula</option>
        <option>Emerald Glass</option>
      </select>
      <button class="btn-purple">Copy Room Link</button>
    </div>
  </div>

  <div class="video-card">
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <div class="controls-panel">
    <button class="icon-btn" id="micBtn">🎙️</button>
    <button class="icon-btn" id="camBtn">📹</button>
    <button class="icon-btn" id="switchCamBtn">🔄</button>
    <button class="icon-btn" id="chatBtn">💬</button>
  </div>

  <div class="chat-card">
    <div class="chat-header">
      <div class="chat-title">Live Room Chat</div>
      <select class="lang-select">
        <option>Translate to Spanish</option>
        <option>Translate to English</option>
      </select>
    </div>
  </div>

  <script>
    const localVideo = document.getElementById('localVideo');
    const micBtn = document.getElementById('micBtn');
    const camBtn = document.getElementById('camBtn');
    let localStream;

    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then(stream => {
        localStream = stream;
        localVideo.srcObject = stream;
      })
      .catch(error => {
        alert('Camera/Mic access error: ' + error.message);
      });

    micBtn.addEventListener('click', () => {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        audioTrack.enabled = !audioTrack.enabled;
        micBtn.style.opacity = audioTrack.enabled ? '1' : '0.4';
      }
    });

    camBtn.addEventListener('click', () => {
      if (!localStream) return;
      const videoTrack = localStream.getVideoTracks()[0];
      if (videoTrack) {
        videoTrack.enabled = !videoTrack.enabled;
        camBtn.style.opacity = videoTrack.enabled ? '1' : '0.4';
      }
    });
  </script>
</body>
</html>
