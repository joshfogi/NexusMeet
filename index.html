<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusMeet</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0f12;
      color: #ffffff;
      font-family: Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .controls-bar {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex;
      gap: 12px;
      background: rgba(20, 20, 30, 0.85);
      padding: 12px 20px;
      border-radius: 40px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .btn {
      background: #2a2e39;
      color: #ffffff;
      border: none;
      padding: 12px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-danger {
      background: #e63946;
    }
  </style>
</head>
<body>
  <div class="video-container">
    <video id="localVideo" autoplay playsinline muted></video>
  </div>
  <div class="controls-bar">
    <button class="btn" id="micBtn">Mute</button>
    <button class="btn" id="camBtn">Camera</button>
    <button class="btn btn-danger" id="leaveBtn">End</button>
  </div>
  <script>
    const localVideo = document.getElementById('localVideo');
    const micBtn = document.getElementById('micBtn');
    const camBtn = document.getElementById('camBtn');
    let localStream;

    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then(stream => {
        localStream = stream;
        localVideo.srcObject = stream;
      })
      .catch(error => {
        alert('Camera/Mic access error: ' + error.message);
      });

    micBtn.addEventListener('click', () => {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        audioTrack.enabled = !audioTrack.enabled;
        micBtn.textContent = audioTrack.enabled ? 'Mute' : 'Unmute'; 
      }
    });

    camBtn.addEventListener('click', () => {
      if (!localStream) return;
      const videoTrack = localStream.getVideoTracks()[0];
      if (videoTrack) {
        videoTrack.enabled = !videoTrack.enabled;
        camBtn.textContent = videoTrack.enabled ? 'Camera Off' : 'Camera On'; 
      }
    });
  </script>
</body>
</html>
